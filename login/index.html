<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign In | PantoMart</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Local CSS -->
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <link rel="stylesheet" href="../assets/css/main.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      background: #f9f9f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background Layer ── */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.82;
      mix-blend-mode: multiply;
    }
    .bg-texture {
      position: absolute;
      inset: 0;
      z-index: 1;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .bg-gradient {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(to top right, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
    }

    /* ── Login Card ── */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 16px;
      background: #ffffff;
      border: 1px solid #e9c349;
      padding: 48px;
    }

    /* ── Branding ── */
    .brand-title {
      font-family: 'Noto Serif', serif;
      font-size: 48px;
      line-height: 56px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      text-align: center;
      margin-bottom: 6px;
    }
    .brand-sub {
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4c4546;
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 32px;
    }
    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .input-label {
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1b1b1b;
    }
    .input-forgot {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4c4546;
      text-decoration: none;
      transition: color 0.2s;
    }
    .input-forgot:hover { color: #e9c349; }

    .input-field {
      width: 100%;
      border: none;
      border-bottom: 1px solid #000000;
      border-radius: 0;
      background: transparent;
      padding: 10px 0;
      font-family: 'Manrope', sans-serif;
      font-size: 18px;
      line-height: 28px;
      color: #000000;
      outline: none;
      transition: border-color 0.25s;
    }
    .input-field::placeholder { color: rgba(76,69,70,0.5); }
    .input-field:focus { border-bottom-color: #e9c349; }

    /* ── Error Message ── */
    #auth-error {
      background: #ffdad6;
      color: #93000a;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      margin-bottom: 24px;
      border-left: 3px solid #ba1a1a;
    }
    #auth-error.hidden { display: none; }

    /* ── Submit Button ── */
    .submit-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #e9c349;
      color: #241a00;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 16px;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: opacity 0.25s;
      margin-top: 16px;
    }
    .submit-btn:hover { opacity: 0.85; }
    .submit-btn .material-symbols-outlined {
      font-size: 18px;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }

    /* ── Secondary Link ── */
    .secondary-action {
      text-align: center;
      margin-top: 24px;
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      color: #4c4546;
    }
    .secondary-action a {
      color: #000000;
      text-decoration: none;
      border-bottom: 1px solid #000000;
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .secondary-action a:hover {
      color: #e9c349;
      border-color: #e9c349;
    }
  </style>
</head>

<body>

  <!-- ── Background ── -->
  <div class="bg-layer">
    <img
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsaBJ2ACqsm1iv7-PcKBs-SC459cSdnfLI3EhdGlHm-iusIknlx3J8B4sY_LUA5rZ7fep5w7hJS-2TnXdZ3Y27Px_00_scziiOCgn6ziYtt624XhGwQtFaJp1I3TRUat2PTiP4E7OeXhujRR_s6yKk6ENtoOaO3t5ypfmv340xvqDQlB3Iu8agM7zOyyI95eHQ_1XK-hZJrQj8CJds0qPB7hkOU7pub9uxIi1YeTzGAdUkRw0TVtgJfgMJYYGS3_kwuTpeiwnWZ-s_"
      alt=""
    />
    <div class="bg-texture"></div>
    <div class="bg-gradient"></div>
  </div>

  <!-- ── Login Card ── -->
  <main class="login-card">

    <!-- Branding -->
    <div>
      <h1 class="brand-title">PantoMart</h1>
      <p class="brand-sub">Sign In</p>
    </div>

    <!-- Error -->
    <div id="auth-error" class="hidden"></div>

    <!-- Form -->
    <form id="login-form" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label class="input-label" for="email">Email Address</label>
        <input
          class="input-field"
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="form-label-row">
          <label class="input-label" for="password">Password</label>
          <a class="input-forgot" href="#">Forgot?</a>
        </div>
        <input
          class="input-field"
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <!-- Submit -->
      <button class="submit-btn" type="submit">
        Sign In
        <span class="material-symbols-outlined">arrow_right_alt</span>
      </button>

    </form>

    <!-- Register Link -->
    <p class="secondary-action">
      New to the atelier?
      <a href="../register/index.html">Create an account</a>
    </p>

  </main>

  <!-- Scripts -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>

</body>
</html>
