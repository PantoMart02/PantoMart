<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PantoMart</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind classes are compiled locally via: npm run build:css -->

  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Manrope', sans-serif;
      background: #f9f9f9;
      color: #1b1b1b;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }

    /* ── Top Nav ── */
    #top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 50;
      background: rgba(249,249,249,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e9c349;
      height: 80px;
      display: flex;
      align-items: center;
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 64px;
    }
    .nav-brand {
      font-family: 'Noto Serif', serif;
      font-size: 24px;
      font-weight: 700;
      color: #000;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 32px;
    }
    .nav-links a {
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1b1b1b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #e9c349;
      border-bottom: 2px solid #e9c349;
      padding-bottom: 2px;
    }
    .nav-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .nav-icons button {
      background: none;
      border: none;
      cursor: pointer;
      color: #000;
      transition: opacity 0.2s;
    }
    .nav-icons button:hover { opacity: 0.7; }

    /* ── Page body offset for fixed nav ── */
    #page-body {
      padding-top: 80px;
    }

    /* ── Loading spinner ── */
    #loading-state {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid #e2e2e2;
      border-top-color: #e9c349;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error state ── */
    #category-error {
      max-width: 600px;
      margin: 80px auto;
      padding: 24px;
      background: #ffdad6;
      color: #93000a;
      border-left: 4px solid #ba1a1a;
      font-family: 'Manrope', sans-serif;
    }
    #category-error.hidden { display: none; }
  </style>
</head>

<body>

  <!-- ── Fixed Nav ── -->
  <nav id="top-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">PantoMart</a>
      <div class="nav-links" id="nav-links">
        <a href="category.html?cat=care" data-cat="care">Skincare</a>
        <a href="category.html?cat=fit"  data-cat="fit">Fitness</a>
        <a href="category.html?cat=style" data-cat="style">Style</a>
        <a href="category.html?cat=space" data-cat="space">Home Decor</a>
        <a href="category.html?cat=pet"  data-cat="pet">Pet Care</a>
      </div>
      <div class="nav-icons">
        <button onclick="window.location.href='login/index.html'" title="Account">
          <span class="material-symbols-outlined">person</span>
        </button>
        <button onclick="window.location.href='cart.html'" title="Cart">
          <span class="material-symbols-outlined">shopping_bag</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ── Page Body ── -->
  <div id="page-body">

    <!-- Error -->
    <div id="category-error" class="hidden"></div>

    <!-- Loading -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p style="font-family:'Manrope',sans-serif;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:#4c4546;">Loading Collection…</p>
    </div>

    <!-- Category content injected here -->
    <div id="category-container"></div>

  </div>

  <script>
    // Highlight active nav link
    (function() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat')?.toLowerCase();
      if (cat) {
        document.querySelectorAll('.nav-links a').forEach(a => {
          if (a.dataset.cat === cat) a.classList.add('active');
        });
        // Update page title & nav brand
        const titles = { care: 'Care', fit: 'Fit', style: 'Style', space: 'Space', pet: 'Pet' };
        if (titles[cat]) {
          document.title = titles[cat] + ' | PantoMart';
          const navBrand = document.querySelector('.nav-brand');
          if (navBrand) navBrand.textContent = 'Panto' + titles[cat];
        }
      }
    })();
  </script>

  <script src="assets/js/api.js?v=2"></script>
  <script src="assets/js/category.js?v=2"></script>

</body>
</html>
